<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Trending · Geo Map</title>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    body {
        background: #080C14;
        color: #E8EDF5;
        font-family: 'DM Sans', sans-serif;
        display: flex;
        flex-direction: column;
    }

    header {
        height: 74px;
        padding: 1.1rem 2.5rem;
        border-bottom: 1px solid #1C2A3A;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        background: linear-gradient(90deg, #0D1421, #101A2B);
        gap: 2rem;
        z-index: 9999;
        position: relative;
    }

    .header-left {
        display: flex;
        align-items: baseline;
        gap: 1rem;
        flex-wrap: wrap;
    }

    .header-left h1 {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 2.1rem;
        letter-spacing: 4px;
        color: #E8EDF5;
    }

    .header-left h1 span {
        color: #FF3B30;
    }

    .header-left p {
        font-family: 'DM Mono', monospace;
        font-size: 0.68rem;
        color: #9BAABD;
        letter-spacing: 3px;
        text-transform: uppercase;
    }

    .legend {
        display: flex;
        gap: 1.2rem;
        align-items: center;
        flex-wrap: wrap;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-family: 'DM Mono', monospace;
        font-size: 0.68rem;
        color: #9BAABD;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    .legend-dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        flex-shrink: 0;
    }

    .map-container {
        position: relative;
        flex: 1;
        overflow: hidden;
    }

    .map-frame {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
    }

    .note {
        position: absolute;
        left: 18px;
        bottom: 18px;
        z-index: 9998;
        max-width: 420px;
        background: rgba(13,20,33,0.92);
        border: 1px solid #1C2A3A;
        color: #9BAABD;
        padding: 10px 13px;
        border-radius: 8px;
        font-family: 'DM Mono', monospace;
        font-size: 0.68rem;
        letter-spacing: 1px;
    }
    </style>
</head>

<body>

<header>
    <div class="header-left">
        <h1>YOUTUBE <span>GEO</span> MAP</h1>
        <p>Resumen georreferenciado · Video · Categoría · Polaridad</p>
    </div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-dot" style="background:#00E5A0"></div>
            Polaridad positiva
        </div>

        <div class="legend-item">
            <div class="legend-dot" style="background:#FF3B30"></div>
            Polaridad negativa
        </div>

        <div class="legend-item">
            Tamaño = vistas totales
        </div>

        <div class="legend-item">
            Clic para detalles
        </div>
    </div>
</header>

<div class="map-container">
    <iframe src="geo_map_inner.html" class="map-frame"></iframe>

    <div class="note">
        Cada marcador resume un país. El color representa la polaridad del público y el tamaño indica el volumen total de vistas.
    </div>
</div>

</body>
</html>
